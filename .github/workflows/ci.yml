name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze_test:
    name: analyze + test (mobile & tv)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [mobile, tv]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: flutter-${{ matrix.app }}

      - name: pub get
        working-directory: apps/${{ matrix.app }}
        run: flutter pub get

      - name: flutter analyze
        working-directory: apps/${{ matrix.app }}
        run: flutter analyze --no-pub

      - name: flutter test
        working-directory: apps/${{ matrix.app }}
        run: flutter test

  discover_packages:
    name: discover shared packages
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.list.outputs.packages }}
    steps:
      - uses: actions/checkout@v4

      # Shared packages under packages/ are part of the build graph: both
      # apps depend on them, so a regression there must fail CI. Discovered
      # dynamically so adding a package needs no matrix edit here.
      - id: list
        name: list packages
        run: |
          set -euo pipefail
          json=$(find packages -maxdepth 2 -name pubspec.yaml -not -path '*/.*' \
            | sed 's|/pubspec.yaml$||' \
            | sort \
            | jq -R -s -c 'split("\n") | map(select(length > 0))
                         | map({path: ., name: (split("/") | last)})')
          echo "Discovered shared packages: $json"
          echo "packages=$json" >> "$GITHUB_OUTPUT"

  analyze_test_packages:
    name: analyze + test (${{ matrix.package.name }})
    needs: discover_packages
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.discover_packages.outputs.packages) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: flutter-${{ matrix.package.name }}

      - name: pub get
        working-directory: ${{ matrix.package.path }}
        run: flutter pub get

      - name: flutter analyze
        working-directory: ${{ matrix.package.path }}
        run: flutter analyze --no-pub

      - name: flutter test
        working-directory: ${{ matrix.package.path }}
        run: flutter test

  test_native_unit:
    name: native unit tests (mobile)
    runs-on: ubuntu-latest
    needs: analyze_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: flutter-mobile-native-test

      - name: pub get
        working-directory: apps/mobile
        run: flutter pub get

      # Scoped to :app so plugin subprojects (whose own suites may fail for
      # unrelated reasons) cannot fail this build. Our Kotlin tests cover
      # RangeRequestParser, UserAgentParser and MimeTypeDetector.
      - name: native unit tests
        working-directory: apps/mobile/android
        run: ./gradlew :app:testDebugUnitTest

  build_release_apk:
    name: build release APK (mobile)
    runs-on: ubuntu-latest
    needs: [analyze_test, analyze_test_packages, test_native_unit]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: flutter-mobile-build

      - name: pub get
        working-directory: apps/mobile
        run: flutter pub get

      - name: flutter build apk release
        working-directory: apps/mobile
        # Release APKs are signed with the upload keystore when the repo
        # secrets are present. The app's build.gradle.kts reads them via
        # LS_KEYSTORE_BASE64 / LS_STORE_PASSWORD / LS_KEY_ALIAS /
        # LS_KEY_PASSWORD and falls back to the debug key otherwise.
        env:
          LS_KEYSTORE_BASE64: ${{ secrets.LS_KEYSTORE_BASE64 }}
          LS_STORE_PASSWORD: ${{ secrets.LS_STORE_PASSWORD }}
          LS_KEY_ALIAS: ${{ secrets.LS_KEY_ALIAS }}
          LS_KEY_PASSWORD: ${{ secrets.LS_KEY_PASSWORD }}
        run: flutter build apk --release

      - name: upload apk
        uses: actions/upload-artifact@v4
        with:
          name: localstream-release-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

  build_release_tv:
    name: build release APK (tv)
    runs-on: ubuntu-latest
    needs: [analyze_test, analyze_test_packages, test_native_unit]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: flutter-tv-build

      - name: pub get
        working-directory: apps/tv
        run: flutter pub get

      - name: flutter build apk release
        working-directory: apps/tv
        # Release APKs are signed with the same upload keystore as mobile
        # when the repo secrets (LS_KEYSTORE_BASE64 etc.) are present.
        env:
          LS_KEYSTORE_BASE64: ${{ secrets.LS_KEYSTORE_BASE64 }}
          LS_STORE_PASSWORD: ${{ secrets.LS_STORE_PASSWORD }}
          LS_KEY_ALIAS: ${{ secrets.LS_KEY_ALIAS }}
          LS_KEY_PASSWORD: ${{ secrets.LS_KEY_PASSWORD }}
        run: flutter build apk --release

      - name: upload apk
        uses: actions/upload-artifact@v4
        with:
          name: localstream-tv-release-apk
          path: apps/tv/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

  release:
    name: publish GitHub Release (tag push)
    runs-on: ubuntu-latest
    needs: [build_release_apk, build_release_tv]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: localstream-release-apk
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: localstream-tv-release-apk
          path: dist-tv

      # Distinct asset names (both artifacts are named app-release.apk, which
      # would otherwise collide on the release). The apps' update checkers use
      # these names to pick the right APK from the latest release.
      - name: stage release assets
        run: |
          mv "dist/app-release.apk" "dist/localstream-mobile-${{ github.ref_name }}.apk"
          mv "dist-tv/app-release.apk" "dist-tv/localstream-tv-${{ github.ref_name }}.apk"

      - name: publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/localstream-mobile-${{ github.ref_name }}.apk
            dist-tv/localstream-tv-${{ github.ref_name }}.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
