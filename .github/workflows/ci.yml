name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze_test:
    name: analyze + test (mobile & tv)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [mobile, tv]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: flutter-${{ matrix.app }}

      - name: pub get
        working-directory: apps/${{ matrix.app }}
        run: flutter pub get

      - name: flutter analyze
        working-directory: apps/${{ matrix.app }}
        run: flutter analyze --no-pub

      - name: flutter test
        working-directory: apps/${{ matrix.app }}
        run: flutter test

  build_release_apk:
    name: build release APK (mobile)
    runs-on: ubuntu-latest
    needs: analyze_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: flutter-mobile-build

      - name: pub get
        working-directory: apps/mobile
        run: flutter pub get

      - name: flutter build apk release
        working-directory: apps/mobile
        run: flutter build apk --release

      - name: upload apk
        uses: actions/upload-artifact@v4
        with:
          name: localstream-release-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

  release:
    name: publish GitHub Release (tag push)
    runs-on: ubuntu-latest
    needs: build_release_apk
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: localstream-release-apk
          path: dist

      - name: publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/app-release.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
